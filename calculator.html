<!DOCTYPE html>
<html lang="en">
<head>
 <style>

  .calc{
    display: grid;
    grid-template-columns: repeat(4,40px);
    gap: 2px;
    justify-content: center;
    align-content: center;
    min-height: 100vh;
    border: 1px solid black;
    min-height: 100vh;
  }

  button{
    width:40px;
    height:40px;
    border: 1px solid black;
    background-color: rgb(83, 82, 82);
    border-radius: 17px;
  }
 </style>
  <title>Calculator</title>
</head>
<body>
    <div class="calc">

    <button onclick="
        calculation += '1';
        console.log(calculation);
        
        ">1
    </button>

    <button onclick="
        calculation += '2';
        console.log(calculation);
        ">2
    </button>

    <button onclick="
        calculation += '3';
        console.log(calculation);
        ">3
    </button>
    
    <button onclick="
        calculation += '+';
        console.log(calculation);
        ">+
    </button>

    <button onclick="
        calculation += '4';
        console.log(calculation);
        ">4
    </button>
    
    <button onclick="
        calculation += '5';
        console.log(calculation);
        ">5
    </button>
    
    <button onclick="
        calculation += '6';
        console.log(calculation);
        ">6
    </button>

    <button onclick="
        calculation += '-';
        console.log(calculation);
        ">-
    </button>

    <button onclick="
        calculation += '7';
        console.log(calculation);
        ">7
    </button>

    <button onclick="
        calculation += '8';
        console.log(calculation);
        ">8
    </button>

    <button onclick="
        calculation += '9';
        console.log(calculation);
        ">9
    </button>
    
    <button onclick="
        calculation += '*';
        console.log(calculation);
        ">*
    </button>

    <button onclick="
        calculation += '%';
        console.log(calculation);
        ">%
    </button>

    <button onclick="
        calculation += '0';
        console.log(calculation);
        ">0
    </button>

    <button onclick="
        calculation += '.';
        console.log(calculation);
        ">.
    </button>

    <button onclick="
        calculation = eval(calculation);
        console.log(calculation);
        ">=
    </button>
   </div>
  <script>
     let calculation = '';
  </script>

</body>
</html>
