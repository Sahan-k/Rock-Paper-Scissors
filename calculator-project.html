<!DOCTYPE html>
<html lang="en">
<head>
 <style>

  body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;

  }

  .calc{
    display: grid;
    grid-template-columns: repeat(4,40px);
    gap: 2px;
    width:max-content;
    padding: 10px;
    border: 2px solid black;
    background-color: rgb(2, 2, 2);
    border-radius: 17px;
  
  }

  button{
    width:40px;
    height:40px;
    border: 1px solid black;
    color: rgb(6, 43, 249);
    background-color: rgb(0, 0, 0);
    border-radius: 17px;
    box-shadow: 0px 0px 10px rgb(6, 23, 216);
  }

  #display{
    grid-column: 1 / -1;
    width: 170px;
    height: 45px;
    box-sizing: border-box;
    margin-bottom: 5px;
    border: 1px solid black;
    color: rgb(241, 241, 241);
    background-color: rgb(10, 10, 10);
    border-radius: 17px;
  }

 </style>
  <title>Calculator</title>
</head>
<body>
    <div class="calc">
    <textarea id="display" rows="1" cols="20" readonly></textarea>

    <button onclick="
        calculation = '';
        document.getElementById('display').value = calculation;
        ">AC
    </button>

    <button onclick="
        calculation = calculation.slice(0,-1);
        document.getElementById('display').value = calculation;
        ">x
    </button>

    <button onclick="
        press('^');
      ">^
    </button>

    <button onclick="
        press('÷');
        console.log(calculation);
        ">÷
    </button>

    <button onclick="
        press('1');
        console.log(calculation);
        ">1
    </button>

    <button onclick="
        press('2');
        console.log(calculation);
        ">2
    </button>

    <button onclick="
        press('3');
        console.log(calculation);
        ">3
    </button>
    
    <button onclick="
        press('+');
        console.log(calculation);
        ">+
    </button>

    <button onclick="
        press('4');
        console.log(calculation);
        ">4
    </button>
    
    <button onclick="
        press('5');
        console.log(calculation);
        ">5
    </button>
    
    <button onclick="
        press('6');
        console.log(calculation);
        ">6
    </button>

    <button onclick="
        press('-');
        console.log(calculation);
        ">-
    </button>

    <button onclick="
        press('7');
        console.log(calculation);
        ">7
    </button>

    <button onclick="
        press('8');
        console.log(calculation);
        ">8
    </button>

    <button onclick="
        press('9');
        console.log(calculation);
        ">9
    </button>
    
    <button onclick="
        press('*');
        console.log(calculation);
        ">*
    </button>

    <button onclick="
        press('%');
        console.log(calculation);
        ">%
    </button>

    <button onclick="
        press('0');
        console.log(calculation);
        ">0
    </button>

    <button onclick="
        press('.');
        console.log(calculation);
        ">.
    </button>

    <button onclick="
        calculation = eval(calculation);
        document.getElementById('display').value = calculation;
        console.log(calculation);
        ">=
    </button>
   </div>
  <script>
     let calculation = '';
     function press(value) {
        calculation += value === '^' ? '**' : value;
        document.getElementById('display').value += value;

    }
  </script>

</body>
</html>
